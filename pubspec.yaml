name: bae_talk
description: Bae Talk - Fashion Marketplace App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # UI & Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  flutter_slidable: ^3.1.1

  # Payment
  razorpay_flutter: ^1.3.6

  # Local Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1
  badges: ^3.1.2
  fluttertoast: ^8.2.8
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
